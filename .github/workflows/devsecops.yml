name: SecureShop — DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

jobs:

  sast:
    name: SAST
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bandit scan
        run: |
          pip install bandit
          mkdir -p security/reports
          bandit -r services/user-service services/order-service services/inventory-service services/notification-service \
            -f json -o security/reports/bandit.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: security/reports/bandit.json

      - name: Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/javascript p/nodejs p/owasp-top-ten"
          generateSarif: "1"

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep


  sca:
    name: SCA (Trivy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy


  secrets:
    name: Secrets detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build:
    name: Build services
    runs-on: ubuntu-latest
    needs: [sast, sca, secrets]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Compose
        run: docker compose build


  container_scan:
    name: Container scanning
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        service: [user-service, product-service, order-service, payment-service, notification-service, inventory-service, delivery-service]

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secureshop/${{ matrix.service }} ./services/${{ matrix.service }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secureshop/${{ matrix.service }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}


  dast:
    name: DAST (ZAP)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Start system
        run: |
          docker compose up -d
          sleep 40
          curl -f http://localhost/health

      - name: OWASP ZAP scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost
        continue-on-error: true

      - name: Stop system
        if: always()
        run: docker compose down -v