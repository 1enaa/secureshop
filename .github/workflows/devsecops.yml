name: SecureShop — DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 🔐 GLOBAL PERMISSIONS
permissions:
  contents: read
  security-events: write

jobs:

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 1 — SAST                              ║
  # ╚══════════════════════════════════════════════╝
  sast:
    name: "SAST"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bandit (Python)
        run: |
          pip install bandit
          mkdir -p security/reports
          bandit -r services/user-service services/order-service \
                    services/inventory-service services/notification-service \
            -f json -o security/reports/bandit-report.json --exit-zero

      - uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: security/reports/bandit-report.json

      - name: Semgrep (Node.js)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/javascript p/nodejs p/owasp-top-ten"
          generateSarif: "1"
        continue-on-error: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 2 — SCA                               ║
  # ╚══════════════════════════════════════════════╝
  sca:
    name: "SCA"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          format: sarif
          output: security/reports/trivy-sca.sarif
          severity: HIGH,CRITICAL

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: security/reports/trivy-sca.sarif
          category: trivy-sca

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 3 — SECRETS DETECTION                 ║
  # ╚══════════════════════════════════════════════╝
  secrets:
    name: "Secrets Detection"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 4 — BUILD                             ║
  # ╚══════════════════════════════════════════════╝
  build:
    name: "Build All Images"
    runs-on: ubuntu-latest
    needs: [sast, sca, secrets]

    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 5 — CONTAINER SCAN                    ║
  # ╚══════════════════════════════════════════════╝
  container-scan:
    name: "Container Scan"
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      security-events: write

    strategy:
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - payment-service
          - notification-service
          - inventory-service
          - delivery-service

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secureshop/${{ matrix.service }}:ci ./services/${{ matrix.service }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secureshop/${{ matrix.service }}:ci
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 6 — IaC SCAN                         ║
  # ╚══════════════════════════════════════════════╝
  iac:
    name: "IaC Scan (Checkov)"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile,docker_compose
          output_format: sarif
          output_file_path: security/reports/checkov.sarif
        continue-on-error: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: security/reports/checkov.sarif
          category: checkov

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 7 — DAST                              ║
  # ╚══════════════════════════════════════════════╝
  dast:
    name: "DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d
          sleep 35
          curl -f http://localhost/health

      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost"
          cmd_options: "-a -j"
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

      - name: Shutdown
        if: always()
        run: docker compose down -v
