version: '3.8'

# VULN: Hardcoded credentials throughout (Checkov will flag these)
# VULN: No resource limits (DoS risk)
# VULN: Services exposed directly without network isolation
# VULN: privileged: true on several containers
# VULN: No read-only rootfs

services:

  api-gateway:
    build: ./api-gateway
    ports:
      - "80:80"    # VULN: HTTP (not HTTPS) exposed on port 80
      - "443:443"
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
      - inventory-service
      - delivery-service
    networks:
      - secureshop-net

  user-service:
    build: ./services/user-service
    ports:
      - "8001:8001"   # VULN: service directly exposed to host
    environment:
      # VULN: hardcoded secrets in docker-compose (Checkov CKV_SECRET_*)
      - JWT_SECRET=supersecret123
      - DB_PASSWORD=admin123
      - ADMIN_API_KEY=hardcoded-api-key-9999
      - SMTP_PASSWORD=SmtpP@ss_Hardcoded!
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    # VULN: running as root (no user directive)
    volumes:
      - ./services/user-service:/app   # VULN: mounting source into container
      - /tmp:/tmp                       # VULN: host /tmp mounted
    networks:
      - secureshop-net

  product-service:
    build: ./services/product-service
    ports:
      - "8002:8002"
    environment:
      - API_KEY=prod-api-key-hardcoded-abc
      - JWT_SECRET=supersecret123
      - STRIPE_SECRET=sk_live_HARDCODED_51ABCDEF_STRIPE_KEY_xyz
      - NODE_ENV=development
    networks:
      - secureshop-net

  order-service:
    build: ./services/order-service
    ports:
      - "8003:8003"
    environment:
      - SECRET_KEY=order-secret-key-123
      - DB_PASSWORD=orderdb_pass
      - PAYMENT_API_KEY=pk_live_HARDCODED_KEY_12345
      - FLASK_DEBUG=1
    networks:
      - secureshop-net

  payment-service:
    build: ./services/payment-service
    ports:
      - "8004:8004"
    environment:
      - STRIPE_SECRET_KEY=sk_live_HARDCODED_51ABCDEF_STRIPE_KEY_xyz
      - PAYPAL_SECRET=EHardcoded-paypal-secret-key-xyz
      - STRIPE_WEBHOOK_KEY=whsec_HARDCODED_WEBHOOK_SECRET
      - JWT_SECRET=supersecret123
    # VULN: privileged mode gives container full host access
    privileged: true
    networks:
      - secureshop-net

  notification-service:
    build: ./services/notification-service
    ports:
      - "8005:8005"
    environment:
      - SMTP_PASSWORD=SmtpP@ss_Hardcoded!
      - SMTP_API_KEY=SG.hardcoded_sendgrid_api_key_xyz
      - RABBITMQ_PASS=admin123
      - FTP_PASS=ftp_pass_123
      - FLASK_DEBUG=1
    depends_on:
      - rabbitmq
    networks:
      - secureshop-net

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "8006:8006"
    environment:
      - API_KEY=inventory-api-key-hardcoded
      - ADMIN_TOKEN=admin-token-9876
      - DB_PASS=inv_db_pass_123
      - FLASK_DEBUG=1
    networks:
      - secureshop-net

  delivery-service:
    build: ./services/delivery-service
    ports:
      - "8007:8007"
    environment:
      - DHL_API_KEY=dhl-api-key-hardcoded-XYZ123
      - FEDEX_API_KEY=fedex-secret-key-hardcoded-ABCDEF
      - UPS_API_KEY=ups-api-key-hardcoded-UVWXYZ
      - JWT_SECRET=supersecret123
    networks:
      - secureshop-net

  rabbitmq:
    image: rabbitmq:3.8-management
    ports:
      - "5672:5672"
      - "15672:15672"   # VULN: management UI exposed to host
    environment:
      # VULN: default/weak credentials
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    networks:
      - secureshop-net

networks:
  secureshop-net:
    driver: bridge
    # VULN: no network segmentation between services