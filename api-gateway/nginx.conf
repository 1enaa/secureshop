worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Rate limiting: 100 req/min per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    # Security headers applied globally
    add_header X-Frame-Options        "DENY"                            always;
    add_header X-Content-Type-Options "nosniff"                        always;
    add_header X-XSS-Protection       "1; mode=block"                  always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'"            always;

    upstream user_service      { server user-service:8001; }
    upstream product_service   { server product-service:8002; }
    upstream order_service     { server order-service:8003; }
    upstream payment_service   { server payment-service:8004; }
    upstream notif_service     { server notification-service:8005; }
    upstream inventory_service { server inventory-service:8006; }
    upstream delivery_service  { server delivery-service:8007; }

    server {
        listen 80;
        server_name localhost;
        limit_req zone=api burst=20 nodelay;

        # ── Gateway health ────────────────────────────────────────────────────
        location = /health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── User Service (public: register/login) ─────────────────────────────
        location ~ ^/api/v1/(register|login)$ {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            rewrite ^/api/v1/(.*) /$1 break;
        }
        location /api/v1/profile {
            proxy_pass http://user_service/profile;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Product Service ───────────────────────────────────────────────────
        location /api/v1/products {
            proxy_pass http://product_service/products;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/categories {
            proxy_pass http://product_service/categories;
            proxy_set_header Host $host;
        }

        # ── Order Service ─────────────────────────────────────────────────────
        location /api/v1/orders {
            proxy_pass http://order_service/orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/cart {
            proxy_pass http://order_service/cart;
            proxy_set_header Host $host;
        }

        # ── Payment Service ───────────────────────────────────────────────────
        location /api/v1/payments {
            proxy_pass http://payment_service/payments;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Inventory Service ─────────────────────────────────────────────────
        location /api/v1/inventory {
            proxy_pass http://inventory_service/stock;
            proxy_set_header Host $host;
        }

        # ── Notification Service ──────────────────────────────────────────────
        location /api/v1/notifications {
            proxy_pass http://notif_service/notify;
            proxy_set_header Host $host;
        }

        # ── Delivery Service ──────────────────────────────────────────────────
        location /api/v1/shipments {
            proxy_pass http://delivery_service/shipments;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/track {
            proxy_pass http://delivery_service/track;
            proxy_set_header Host $host;
        }

        # ── Catch-all ─────────────────────────────────────────────────────────
        location / {
            return 404 '{"detail":"Not found"}';
            add_header Content-Type application/json;
        }
    }
}
